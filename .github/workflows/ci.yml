name: qidian-rehearsal-agent CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Build FastAPI app
        run: python -c "from backend.app import create_app; create_app(); print('backend app builds')"

      - name: Run rehearsal regression
        run: python -c "import tests.test_rehearsal_agent as t; [getattr(t, n)() for n in dir(t) if n.startswith('test_')]"

      - name: Run deterministic Agent evals
        run: python -m evals.run_rehearsal_evals

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  deployment-config:
    name: Deployment config
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config

      - name: Build public demo image
        run: docker build --file deploy/Dockerfile --tag qidian-rehearsal-agent:ci .
